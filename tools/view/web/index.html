<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body view</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
  #overlay { position: fixed; top: 6px; left: 6px; margin: 0; padding: 4px 6px; font: 11px/1.35 monospace; color: #e8e8e8;
    background: rgba(0, 0, 0, 0.55); border-radius: 3px; white-space: pre; pointer-events: none; }
  #bar { position: fixed; top: 6px; right: 6px; display: flex; gap: 6px; font: 12px monospace; }
  #pointer-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pointer { position: absolute; transform: translate(-50%, -100%); font: bold 11px monospace; white-space: nowrap; text-align: center;
    text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .pointer span { display: block; font-size: 14px; line-height: 14px; }
  .pointer.edge { transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; }
  .pointer.edge b { background: rgba(0, 0, 0, 0.55); padding: 0 3px; border-radius: 2px; }
  #bar select, #bar button { font: inherit; background: #222; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 2px 6px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="pointer-layer"></div>
<pre id="overlay">starting...</pre>
<div id="bar"><select id="agents"></select><button id="pointers" type="button">pointers (P)</button><button id="free" type="button">free camera (F)</button></div>
<script>
  // a page script that failed to load (usually the cljs bundle not built): show the server's message instead of a blank page
  const loadFailed = async () => {
    const reply = await fetch('/web/cljs/viewer.mjs').catch(() => null)
    const text = reply && !reply.ok ? await reply.text() : 'a page script failed to load (see the console)'
    document.getElementById('overlay').textContent = text
    document.getElementById('overlay').style.color = '#ff8a80'
  }
</script>
<script type="module" src="/web/app.mjs" onerror="loadFailed()"></script>
</body>
</html>
