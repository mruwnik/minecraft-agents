<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>villager roster</title>
<style>
  :root { --bg:#14171c; --panel:#1c2027; --line:#2c333d; --ink:#dfe4ec; --dim:#8b95a5; --up:#6ee7a8; --place:#d9b25f; --zone:#5b9ad8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:baseline; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:14px; margin:0; } a { color:var(--zone); text-decoration:none; } a:hover { text-decoration:underline; }
  .muted, small { color:var(--dim); } main { max-width:1200px; margin:auto; padding:18px; }
  .tools { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
  input { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:7px 9px; }
  #filter { flex:1; min-width:220px; } button { font:inherit; color:var(--ink); background:#252b34; border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; }
  #status { margin-left:auto; color:var(--dim); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:5px; margin:8px 0; overflow:hidden; }
  summary { display:grid; grid-template-columns:minmax(180px,1fr) 120px minmax(200px,1fr) minmax(180px,1fr); gap:12px; align-items:center; padding:10px 12px; cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; } summary:hover { background:#232932; }
  .name { color:var(--up); font-weight:600; } .coord { color:var(--place); } .detail { border-top:1px solid var(--line); padding:10px 14px; }
  .offer { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
  .offer:last-child { border:0; } .proof { color:var(--up); } .empty { color:var(--dim); padding:24px; text-align:center; }
  @media(max-width:760px) { summary { grid-template-columns:1fr 1fr; } .offer { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<header><h1>villager roster</h1><a href="/">map and agents →</a><span id="status">loading…</span></header>
<main>
  <div class="tools"><input id="filter" type="search" placeholder="filter UUID, profession, place, item or enchantment"><button id="refresh">refresh</button><small>Last sightings age naturally; unobserved does not mean dead.</small></div>
  <div id="list"></div>
</main>
<script>
const list = document.querySelector('#list')
const status = document.querySelector('#status')
const filter = document.querySelector('#filter')
let records = []
const ago = value => {
  const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(value)) / 1000))
  if (seconds < 60) return `${seconds}s ago`
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`
  return `${Math.floor(seconds / 86400)}d ago`
}
const text = (parent, tag, value, cls) => { const el = document.createElement(tag); el.textContent = value ?? 'unknown'; if (cls) el.className = cls; parent.append(el); return el }
const offerText = offer => {
  const output = offer.outputItem ?? {}
  const enchants = (output.enchants ?? []).map(e => `${e.name} ${e.lvl}`).join(', ')
  const input = [offer.inputItem1, offer.inputItem2].filter(Boolean).map(i => `${i.count} ${i.name}`).join(' + ')
  const uses = `${offer.nbTradeUses ?? '?'} / ${offer.maximumNbTradeUses ?? '?'} uses`
  return { input: input || 'unknown cost', output: `${output.count ?? '?'} ${output.name ?? 'unknown'}${enchants ? ` (${enchants})` : ''}`, uses: `${uses}${offer.tradeDisabled ? ' · disabled' : ''}` }
}
function render () {
  const query = filter.value.trim().toLowerCase()
  const shown = records.filter(v => `${v.uuid} ${v.profession ?? ''} ${v.age ?? ''} ${v.place?.name ?? ''} ${JSON.stringify(v.offers?.items ?? [])}`.toLowerCase().includes(query))
  list.replaceChildren()
  if (!shown.length) { text(list, 'div', records.length ? 'No villagers match this filter.' : 'No villagers have been observed yet.', 'empty'); return }
  for (const v of shown) {
    const card = document.createElement('details'); card.className = 'card'
    const summary = document.createElement('summary')
    text(summary, 'span', `${v.profession ?? 'profession unknown'} · ${v.age ?? 'age unknown'}`, 'name')
    text(summary, 'span', `Lv ${v.level ?? '?'}`)
    text(summary, 'span', v.place?.name ? `place: ${v.place.name}` : 'place not assigned')
    text(summary, 'span', v.lastSeenAt ? `seen ${ago(v.lastSeenAt)} by ${v.lastSeenBy ?? 'unknown'}` : 'no sighting time')
    card.append(summary)
    const detail = document.createElement('div'); detail.className = 'detail'
    text(detail, 'div', `UUID ${v.uuid}`)
    if (v.lastPosition) text(detail, 'div', `last coordinates ${v.lastPosition.x.toFixed(1)}, ${v.lastPosition.y.toFixed(1)}, ${v.lastPosition.z.toFixed(1)}`, 'coord')
    if (v.place?.name) { const row = document.createElement('div'); row.append('Explicit place association: '); const link = document.createElement('a'); link.href = `/?farm=${encodeURIComponent(v.place.name)}`; link.textContent = v.place.name; row.append(link); detail.append(row) }
    if (v.workstationObservation) text(detail, 'div', `matching block observed at ${v.workstationObservation.x},${v.workstationObservation.y},${v.workstationObservation.z}; POI claim unverified`)
    if (v.offers) {
      text(detail, 'h3', `Offers observed ${ago(v.offers.observedAt)} by ${v.offers.observedBy}`)
      for (const offer of v.offers.items ?? []) {
        const row = document.createElement('div'); row.className = 'offer'; const line = offerText(offer)
        text(row, 'span', line.input); text(row, 'span', line.output); text(row, 'span', line.uses); detail.append(row)
      }
    } else text(detail, 'div', 'No merchant offers observed yet.')
    if (v.lockEvidence) text(detail, 'div', `Trade lock verified ${ago(v.lockEvidence.at)} by ${v.lockEvidence.by}: ${v.lockEvidence.basis}`, 'proof')
    if (v.purchases?.length) text(detail, 'div', `Confirmed purchases: ${v.purchases.map(p => `${p.boughtCount ?? ''} ${p.bought ?? 'item'} (offer ${p.offer})`).join('; ')}`)
    card.append(detail); list.append(card)
  }
}
async function load () {
  status.textContent = 'updating…'
  try {
    const response = await fetch('/api/villagers')
    const data = await response.json()
    if (!response.ok || data.error) throw new Error(data.error ?? 'roster request failed')
    records = Object.values(data.villagers ?? {}).sort((a, b) => (a.profession ?? '').localeCompare(b.profession ?? '') || a.uuid.localeCompare(b.uuid))
    render(); status.textContent = `${records.length} UUIDs · refreshed ${new Date().toLocaleTimeString()}`
  } catch (error) { status.textContent = error.message }
}
filter.addEventListener('input', render)
document.querySelector('#refresh').addEventListener('click', load)
load(); setInterval(load, 10000)
</script>
</body>
</html>
