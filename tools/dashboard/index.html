<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent bodies</title>
<style>
  :root {
    --bg: #14171c; --panel: #1c2027; --line: #2c333d; --ink: #dfe4ec; --dim: #8b95a5;
    --up: #6ee7a8; --down: #55606f; --human: #f08ad0; --place: #d9b25f; --zone: #5b8fd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  header .muted { color: var(--dim); }
  header a { color: var(--zone); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .spacer { flex: 1; }
  button { font: inherit; color: var(--ink); background: #252b34; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  button:hover { background: #2f3742; }
  main { display: flex; height: calc(100vh - 38px); }
  #mapwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #mapview { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: var(--dim); pointer-events: none; }
  #actionsLog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the chat drawer sits under the map, never beside it: closed it is one 30px bar, open it takes at most 30% of
     the height, so the map keeps the room it has and the side panel is untouched either way */
  #chat { flex: none; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; max-height: 30vh; }
  #chat.closed { max-height: none; }
  #chat.closed #chatlog, #chat.closed .chatTools { display: none; }
  #chatbar { display: flex; align-items: center; gap: 10px; padding: 5px 12px; flex: none; }
  #chatbar h2 { margin: 0; }
  #chatbar .muted { color: var(--dim); }
  #chatbar .spacer { flex: 1; }
  #chatfilter { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; width: 220px; }
  #chatfilter:focus { outline: none; border-color: var(--zone); }
  #chatbar label { color: var(--dim); cursor: pointer; white-space: nowrap; }
  #chatlog { overflow-y: auto; padding: 4px 12px 8px; scrollbar-color: var(--dim) transparent; }
  #chatlog::-webkit-scrollbar { width: 10px; }
  #chatlog::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 6px; }
  .msg { display: flex; gap: 8px; padding: 1px 4px; border-radius: 3px; align-items: baseline; }
  .msg .when { color: var(--down); flex: none; }
  .msg .who { flex: none; font-weight: 600; }
  .msg .text { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.whisper { color: var(--dim); font-style: italic; }
  .msg.whisper .who { font-weight: 500; }
  .msg .muted { color: var(--dim); font-weight: 400; }
  .msg.human { background: rgba(240,138,208,0.10); }
  .msg.human .text { color: #fff; }
  #chatempty { color: var(--dim); padding: 6px 4px; }
  aside { width: 360px; border-left: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  section { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  #chatbar h2, section h2, #lookSide h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
  section h2 { margin: 0 0 8px; }
  .body { padding: 5px 6px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
  .body:hover { background: #232932; }
  .body.sel { border-color: var(--up); background: #232932; }
  .body .name { color: var(--up); }
  .body.off .name { color: var(--down); }
  .body .meta { color: var(--dim); }
  .body .doing { color: var(--place); }
  #down { margin-top: 8px; line-height: 1.6; }
  #lookimg { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #000; display: block; cursor: zoom-in; }
  #lookOverlay { position: fixed; inset: 0; background: rgba(10,12,16,0.8); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #lookOverlay[hidden] { display: none; }
  /* a fixed width keeps the card from jumping with every frame: the caption's length,
     the HUD/container/inventory blocks all redraw inside this box instead of resizing it */
  #lookCard { display: flex; gap: 12px; width: min(96vw, 980px); max-height: 94vh; }
  #lookMain { flex: 1 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  #lookSide { flex: 0 0 320px; min-height: 0; display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  #lookSide h2 { margin: 0; }
  #actionsLog { flex: 1; min-height: 0; overflow-y: auto; }
  #lookBig { width: 100%; height: auto; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; background: #000; display: block; }
  /* three lines reserved so a one-line or three-line caption never changes the card's height */
  #lookBigMeta { color: var(--dim); white-space: pre-wrap; word-break: break-word; min-height: 3lh; }
  /* the game's own screens: armour/hotbar/inventory, and a container's own grid, both grey insets of the same kind */
  .screen { display: grid; align-self: center; padding: 8px; background: #c6c6c6; border: 2px solid; border-color: #fff #555 #555 #fff; border-radius: 3px; max-width: 100%; }
  .screen:empty { display: none; }
  .screen .slot { position: relative; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; }
  .screen .slot.selected { outline: 2px solid #fff; z-index: 1; }
  .screen img { display: block; width: 32px; height: 32px; image-rendering: pixelated; }
  .screen .count { position: absolute; right: 0; bottom: -2px; color: #fff; font-weight: bold; text-shadow: 2px 2px 0 #3f3f3f; pointer-events: none; }
  .screen .abbr { display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; color: #222; font-weight: bold; }
  #lookInventory { grid-template-columns: repeat(9, 36px); grid-template-rows: repeat(4, 36px) 8px repeat(3, 36px) 8px 36px; }
  #lookWindow { grid-template-columns: repeat(var(--columns), 36px); }
  #lookWindowMeta { color: var(--dim); align-self: center; }
  #lookWindowMeta:empty { display: none; }
  /* the HUD as the game draws it: armour/xp/air above hearts/-/food, each row ten 9x9 icons drawn with CSS, no assets */
  #lookHud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px 12px; align-self: center; width: 340px; }
  #lookHud span:nth-child(2) { justify-self: center; }
  #lookHud i { display: inline-block; width: 9px; height: 9px; margin-right: 1px; }
  #lookHud i.empty { background: #333; }
  #lookHud i.heart { background: #f00; clip-path: polygon(50% 100%, 10% 55%, 10% 25%, 30% 10%, 50% 30%, 70% 10%, 90% 25%, 90% 55%); }
  #lookHud i.heart.half { background: linear-gradient(90deg, #f00 50%, #333 50%); }
  #lookHud i.heart.empty { background: #333; clip-path: polygon(50% 100%, 10% 55%, 10% 25%, 30% 10%, 50% 30%, 70% 10%, 90% 25%, 90% 55%); }
  #lookHud i.food { background: #b5651d; border-radius: 3px; }
  #lookHud i.food.half { background: linear-gradient(90deg, #b5651d 50%, #333 50%); border-radius: 3px; }
  #lookHud i.food.empty { background: #333; border-radius: 3px; }
  #lookHud i.armor { background: #ddd; border-radius: 2px; clip-path: polygon(0 0, 40% 0, 50% 20%, 60% 0, 100% 0, 100% 100%, 0 100%); }
  #lookHud i.armor.half { background: linear-gradient(90deg, #ddd 50%, #333 50%); border-radius: 2px; clip-path: polygon(0 0, 40% 0, 50% 20%, 60% 0, 100% 0, 100% 100%, 0 100%); }
  #lookHud i.armor.empty { background: #333; border-radius: 2px; clip-path: polygon(0 0, 40% 0, 50% 20%, 60% 0, 100% 0, 100% 100%, 0 100%); }
  #lookHud i.bubble { background: #8cf; border-radius: 50%; }
  #lookHud i.bubble.half { background: linear-gradient(90deg, #8cf 50%, #333 50%); border-radius: 50%; }
  #lookHud i.bubble.empty { background: #333; border-radius: 50%; }
  #lookHud .xp { color: #6ee7a8; font-weight: bold; }
  .lookFrame { position: relative; }
  .marks { position: absolute; inset: 0; pointer-events: none; }
  .mark { position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.85); }
  .mark.hostile { border-color: #ff4a4a; }
  .mark.player { border-color: #ff5cff; }
  .mark span { position: absolute; left: -1px; bottom: 100%; padding: 0 3px; font-size: 11px; line-height: 1.3; color: #fff; background: rgba(0,0,0,0.6); white-space: nowrap; }
  #lookmeta { color: var(--dim); margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  #places { white-space: pre-wrap; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row .spacer { flex: 1; }
  .err { color: #f0907e; }
  #planOverlay { position: fixed; inset: 0; background: rgba(10,12,16,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #planOverlay[hidden] { display: none; }
  /* 1080px covers a grid up to ~40 columns (22px/cell) plus the legend beside it and the card's own padding -
     wide enough that the side layout holds for any plan anyone is likely to draw, not just the small ones.
     scrollbar-gutter reserves the scrollbar's width up front: without it, a tall plan's vertical scrollbar only
     shows up after the fit-content width is already chosen, stealing back just enough space to wrap the legend
     below the grid anyway - the exact failure this rule exists to prevent. */
  #planCard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; width: fit-content(min(90vw, 1080px)); max-width: min(90vw, 1080px); max-height: 88vh; overflow: auto; scrollbar-gutter: stable; scrollbar-color: var(--dim) transparent; }
  #planCard::-webkit-scrollbar { width: 10px; }
  #planCard::-webkit-scrollbar-track { background: transparent; }
  #planCard::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 6px; }
  #planCard .planHead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  #planCard h3 { margin: 0; font-size: 13px; letter-spacing: .03em; color: var(--place); }
  #planMeta { color: var(--dim); margin-bottom: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #planCanvas { display: block; border: 1px solid var(--line); border-radius: 4px; image-rendering: pixelated; flex: none; }
  /* the legend is a column beside the grid, not a row under it - it only drops below when the card is too
     narrow to fit both side by side (a small window, or a very wide plan) */
  #planGridRow { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; }
  #planLegend { display: flex; flex-direction: column; gap: 6px; color: var(--ink); font-size: 11px; padding-top: 2px; }
  .legendItem { display: flex; align-items: center; gap: 5px; }
  .legendSwatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.18); flex: none; }
  .legendSwatch.differ { border-color: #f0907e; background: repeating-linear-gradient(-45deg, rgba(240,144,126,0.85) 0 2px, transparent 2px 5px); }
  .legendSwatch.unseen { border-color: #4b5462; background: repeating-linear-gradient(-45deg, rgba(139,149,165,0.6) 0 2px, transparent 2px 5px); }
  .legendSwatch.unsure { border-color: #e0a030; background: repeating-linear-gradient(-45deg, rgba(224,160,48,0.75) 0 2px, transparent 2px 5px); }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .seg button.on { background: #34404e; border-color: var(--zone); color: #fff; }
  #planWorld { color: var(--dim); margin: -4px 0 10px; }
  #planWorld:empty { display: none; }
  #planHover { color: var(--ink); margin-top: 8px; min-height: 1.45em; overflow-wrap: anywhere; }
  #planHover .muted { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>agent bodies</h1>
  <a href="/blueprints">blueprints →</a>
  <a href="/villages">villages →</a>
  <a href="/villagers">villagers →</a>
  <span class="muted" id="clock">—</span>
  <span class="muted" id="counts">—</span>
  <span class="spacer"></span>
  <span class="muted" id="status">connecting…</span>
  <button id="fitbodies">fit bodies</button>
  <button id="fitall">fit everything</button>
</header>
<main>
  <div id="mapwrap">
    <div id="mapview">
      <canvas id="map"></canvas>
      <div id="hint">drag to pan · wheel to zoom · click a body to see through its eyes</div>
    </div>
    <div id="chat">
      <div id="chatbar">
        <h2>chat</h2>
        <span class="muted" id="chatcount">—</span>
        <span class="spacer"></span>
        <input id="chatfilter" class="chatTools" type="search" placeholder="filter by name or text" spellcheck="false">
        <label class="chatTools"><input type="checkbox" id="chatwhispers"> hide whispers</label>
        <button id="chattoggle">hide ▾</button>
      </div>
      <div id="chatlog"></div>
    </div>
  </div>
  <aside>
    <section>
      <h2>through their eyes</h2>
      <div class="row">
        <span id="lookname">pick a body</span>
        <span class="spacer"></span>
        <button id="relook">watch</button>
      </div>
      <div class="lookFrame"><img id="lookimg" alt="" hidden><div id="lookimgMarks" class="marks"></div></div>
      <div id="lookmeta"></div>
    </section>
    <section>
      <h2>bodies</h2>
      <div id="list"></div>
      <div id="down" class="muted"></div>
    </section>
    <section>
      <h2>places</h2>
      <div id="places" class="muted"></div>
    </section>
  </aside>
</main>
<div id="lookOverlay" hidden>
  <div id="lookCard">
    <div id="lookMain">
      <div class="planHead">
        <span id="lookBigMeta"></span>
        <span class="spacer"></span>
        <button id="lookClose">close ×</button>
      </div>
      <div class="lookFrame"><img id="lookBig" alt="" hidden><div id="lookBigMarks" class="marks"></div></div>
      <div id="lookHud"></div>
      <div id="lookWindowMeta"></div>
      <div id="lookWindow" class="screen"></div>
      <div id="lookInventory" class="screen"></div>
    </div>
    <div id="lookSide">
      <h2>actions</h2>
      <div id="actionsLog"></div>
    </div>
  </div>
</div>
<div id="planOverlay" hidden>
  <div id="planCard">
    <div class="planHead">
      <h3 id="planTitle"></h3>
      <span class="seg" id="planView">
        <button data-view="plan" title="what the plan says should stand here">plan</button>
        <button data-view="world" title="what really stands here, as the nearest body sees it">world</button>
        <button data-view="diff" title="the plan, with the cells the world disagrees with marked">diff</button>
      </span>
      <span class="spacer"></span>
      <button id="planClose">close ×</button>
    </div>
    <div id="planMeta"></div>
    <label>View <select id="planLayer" aria-label="Plan bird’s-eye view or layer"></select></label>
    <div id="planWorld"></div>
    <div id="planGridRow">
      <canvas id="planCanvas"></canvas>
      <div id="planLegend"></div>
    </div>
    <div id="planHover"></div>
  </div>
</div>
<script type="module">
import { mapPoints, worldBounds, fitView, project, zoneRect, fitLabels, onCanvas, planRects, cellColour, cellLabel, hitPlan, hitVillagePlace, parsePlacePlan, planLevels, layerDiff, cellWorldBlock, planDiff, cellExpectation, worldColour, worldLabel } from './map.mjs'

const canvas = document.getElementById('map')
const ctx = canvas.getContext('2d')
const el = id => document.getElementById(id)

let snap = { bodies: [], places: [], zones: [], humans: [], agents: [] }
let view = null          // {scale, originX, originZ} in CSS pixels
let follow = true        // until the viewer pans or zooms, a resize refits the map instead of cropping it
let scope = 'bodies'     // what the fit is around: the bodies (and the humans), or every place and zone as well
let selected = null
let hover = null
const size = { w: 0, h: 0 }

// ---------------------------------------------------------------- canvas sizing
const resize = () => {
  const r = canvas.getBoundingClientRect()
  const dpr = window.devicePixelRatio || 1
  size.w = Math.max(1, Math.round(r.width))
  size.h = Math.max(1, Math.round(r.height))
  canvas.width = Math.round(size.w * dpr)
  canvas.height = Math.round(size.h * dpr)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  if (follow) view = null
  draw()
}
window.addEventListener('resize', resize)

// The far corners of this world are 2000 blocks apart, and fitting all of them squeezes the huts into one blob:
// the default fit is around the bodies themselves, with 96 blocks of ground round them.
const refit = () => {
  const wide = scope === 'all'
  const points = mapPoints(snap.bodies, wide ? snap.places : [], wide ? snap.zones : [], snap.humans)
  view = fitView(worldBounds(points, wide ? 24 : 96), size.w - 80, size.h - 80)
  if (!view) return
  view.originX -= 40 / view.scale
  view.originZ -= 40 / view.scale
}

// ---------------------------------------------------------------- drawing
const GRID_STEPS = [16, 32, 64, 128, 256, 512, 1024, 2048]
const gridStep = scale => GRID_STEPS.find(s => s * scale >= 70) ?? GRID_STEPS[GRID_STEPS.length - 1]

const drawGrid = () => {
  const step = gridStep(view.scale)
  const x0 = Math.ceil(view.originX / step) * step
  const z0 = Math.ceil(view.originZ / step) * step
  ctx.strokeStyle = '#20252d'
  ctx.fillStyle = '#4b5462'
  ctx.lineWidth = 1
  ctx.font = '10px ui-monospace, monospace'
  for (let x = x0; project(view, x, 0).px <= size.w; x += step) {
    const { px } = project(view, x, 0)
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, size.h); ctx.stroke()
    ctx.fillText(`x${x}`, px + 3, 11)
  }
  for (let z = z0; project(view, 0, z).py <= size.h; z += step) {
    const { py } = project(view, 0, z)
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(size.w, py); ctx.stroke()
    ctx.fillText(`z${z}`, 3, py - 3)
  }
}

// a label box in canvas pixels, so fitLabels can drop the ones that would be drawn on top of each other
const labelBox = (text, px, py, extra = {}) => ({ text, px, py: py - 9, w: ctx.measureText(text).width + 5, h: 12, ...extra })

const drawZones = () => {
  ctx.font = '10px ui-monospace, monospace'
  return snap.zones.map(zone => {
    const r = zoneRect(view, zone)
    ctx.fillStyle = 'rgba(91,143,214,0.10)'
    ctx.strokeStyle = 'rgba(91,143,214,0.65)'
    ctx.lineWidth = 1
    ctx.fillRect(r.px, r.py, Math.max(r.w, 1), Math.max(r.h, 1))
    ctx.strokeRect(r.px, r.py, Math.max(r.w, 1), Math.max(r.h, 1))
    return labelBox(zone.name, r.px + 2, r.py - 2, { colour: 'rgba(140,180,230,0.85)' })
  }).filter(b => onCanvas(b, size.w, size.h))
}

// a place with a plan is a footprint, not a point: drawn under its point marker and label, and the thing
// the click handler tests hits against so a farm or pen can be opened
const drawFootprints = () => {
  planRects(snap.places).forEach(rect => {
    const a = project(view, rect.x, rect.z)
    const b = project(view, rect.x + rect.w, rect.z + rect.h)
    if (!onCanvas(a, size.w, size.h, 60) && !onCanvas(b, size.w, size.h, 60)) return
    const place = snap.places.find(p => p.name === rect.name)
    const isVillage = Boolean(place?.village)
    const colour = isVillage ? (place.village.state === 'satisfied' ? '110,231,168' : place.village.state === 'below-target' ? '240,144,126' : '224,160,48') : '217,178,95'
    ctx.fillStyle = `rgba(${colour},0.10)`
    ctx.strokeStyle = `rgba(${colour},0.8)`
    ctx.lineWidth = 1
    ctx.fillRect(a.px, a.py, b.px - a.px, b.py - a.py)
    ctx.strokeRect(a.px, a.py, b.px - a.px, b.py - a.py)
  })
}

const drawPlaces = () => {
  ctx.font = '10px ui-monospace, monospace'
  return snap.places.map(place => {
    const at = project(view, place.x, place.z)
    if (!onCanvas(at, size.w, size.h)) return null
    const isVillage = Boolean(place.village)
    ctx.strokeStyle = isVillage ? (place.village.state === 'satisfied' ? '#6ee7a8' : place.village.state === 'below-target' ? '#f0907e' : '#e0a030') : '#d9b25f'
    ctx.lineWidth = 1.2
    ctx.beginPath()
    ctx.moveTo(at.px - 3, at.py); ctx.lineTo(at.px + 3, at.py)
    ctx.moveTo(at.px, at.py - 3); ctx.lineTo(at.px, at.py + 3)
    ctx.stroke()
    const observed = place.village?.population ? (place.village.fresh ? place.village.observed ?? '?' : place.village.lastObservedPopulation === null ? '?' : `last ${place.village.lastObservedPopulation}`) : '?'
    const target = place.village?.population?.target ?? '?'
    const status = isVillage ? (place.village.state === 'satisfied' ? `${observed}/${target} ok` : place.village.state === 'stale' ? `${observed}/${target} stale` : place.village.state === 'not-inspected' ? `?/${target} not checked` : place.village.state === 'unplanned' ? 'no population plan' : `${observed}/${target} ?`) : ''
    const label = isVillage ? `${place.name} · ${status}` : place.name
    return labelBox(label, at.px + 5, at.py + 3, { colour: isVillage ? '#6ee7a8' : 'rgba(217,178,95,0.9)' })
  }).filter(Boolean)
}

const drawLabels = boxes => {
  ctx.font = '10px ui-monospace, monospace'
  fitLabels(boxes).filter(b => b.colour).forEach(b => {
    ctx.fillStyle = b.colour
    ctx.fillText(b.text, b.px, b.py + 9)
  })
}

const bodyDots = () => snap.bodies
  .filter(b => b.up && b.state?.pos)
  .map(b => ({ body: b, ...project(view, b.state.pos.x, b.state.pos.z) }))

// the bodies are why this page exists: they are drawn over everything and their labels are never dropped
const drawBodies = () => bodyDots().map(({ body, px, py }) => {
  const on = body.name === selected || body.name === hover
  ctx.fillStyle = '#6ee7a8'
  ctx.beginPath(); ctx.arc(px, py, on ? 7 : 5, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = on ? '#ffffff' : '#14171c'
  ctx.lineWidth = 2
  ctx.stroke()
  ctx.font = '11px ui-monospace, monospace'
  ctx.fillStyle = '#dfe4ec'
  ctx.fillText(body.name, px + 10, py - 2)
  const under = `${body.state.hp}hp ${body.state.food}f${body.state.doing ? ' · ' + body.state.doing : ''}`
  ctx.fillStyle = '#8b95a5'
  ctx.fillText(under, px + 10, py + 10)
  const w = Math.max(ctx.measureText(body.name).width, ctx.measureText(under).width) + 12
  return { text: body.name, px: px - 8, py: py - 12, w: w + 8, h: 26 }
})

// the humans (every player in sight who is not an agent) are pink diamonds, one each, named
const drawHumans = () => snap.humans.map(human => {
  const { px, py } = project(view, human.x, human.z)
  ctx.fillStyle = '#f08ad0'
  ctx.beginPath()
  ctx.moveTo(px, py - 7); ctx.lineTo(px + 7, py); ctx.lineTo(px, py + 7); ctx.lineTo(px - 7, py)
  ctx.closePath(); ctx.fill()
  ctx.strokeStyle = '#14171c'; ctx.lineWidth = 2; ctx.stroke()
  ctx.fillStyle = '#f08ad0'
  ctx.font = '11px ui-monospace, monospace'
  ctx.fillText(human.name, px + 10, py + 4)
  return { text: human.name, px: px - 8, py: py - 10, w: ctx.measureText(human.name).width + 22, h: 20 }
})

const draw = () => {
  ctx.fillStyle = '#14171c'
  ctx.fillRect(0, 0, size.w, size.h)
  if (!view) refit()
  if (!view) {
    ctx.fillStyle = '#8b95a5'
    ctx.font = '12px ui-monospace, monospace'
    ctx.fillText('no body is up and nothing is marked on the map yet', 20, 30)
    return
  }
  drawGrid()
  drawFootprints()
  const zones = drawZones()
  const places = drawPlaces()
  const humans = drawHumans()
  const bodies = drawBodies()
  // offered in the order that decides who keeps their name when two would overlap
  drawLabels([...bodies, ...humans, ...places, ...zones])
}

// ---------------------------------------------------------------- panning, zooming, picking
let drag = null
canvas.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, moved: false } })
window.addEventListener('mouseup', () => { drag = null })
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect()
  const at = { px: e.clientX - r.left, py: e.clientY - r.top }
  if (drag && view) {
    const dx = e.clientX - drag.x
    const dy = e.clientY - drag.y
    if (Math.abs(dx) + Math.abs(dy) > 2) { drag.moved = true; follow = false }
    view.originX -= dx / view.scale
    view.originZ -= dy / view.scale
    drag.x = e.clientX
    drag.y = e.clientY
    draw()
    return
  }
  const near = pick(at)
  const name = near?.body.name ?? null
  if (name === hover) return
  hover = name
  canvas.style.cursor = name ? 'pointer' : 'crosshair'
  draw()
})

const pick = at => bodyDots()
  .map(d => ({ ...d, dist: Math.hypot(d.px - at.px, d.py - at.py) }))
  .filter(d => d.dist <= 14)
  .sort((a, b) => a.dist - b.dist)[0] ?? null

canvas.addEventListener('click', e => {
  if (drag?.moved) return
  const r = canvas.getBoundingClientRect()
  const at = { px: e.clientX - r.left, py: e.clientY - r.top }
  const hit = pick(at)
  if (hit) { select(hit.body.name); return }
  if (!view) return
  const worldX = at.px / view.scale + view.originX
  const worldZ = at.py / view.scale + view.originZ
  const villageMark = hitVillagePlace(snap.places, worldX, worldZ, 12 / view.scale)
  if (villageMark) { location.href = `/villages?place=${encodeURIComponent(villageMark)}`; return }
  const farm = hitPlan(planRects(snap.places), worldX, worldZ)
  if (farm) {
    const village = snap.places.find(p => p.name === farm)?.village
    if (village) location.href = `/villages?place=${encodeURIComponent(farm)}`
    else openPlan(farm)
  }
})

canvas.addEventListener('wheel', e => {
  e.preventDefault()
  if (!view) return
  follow = false
  const r = canvas.getBoundingClientRect()
  const px = e.clientX - r.left
  const py = e.clientY - r.top
  const worldX = px / view.scale + view.originX
  const worldZ = py / view.scale + view.originZ
  const factor = Math.exp(-e.deltaY * 0.0015)
  view.scale = Math.min(8, Math.max(0.01, view.scale * factor))
  view.originX = worldX - px / view.scale
  view.originZ = worldZ - py / view.scale
  draw()
}, { passive: false })

const fitTo = what => () => { scope = what; follow = true; view = null; draw() }
el('fitbodies').addEventListener('click', fitTo('bodies'))
el('fitall').addEventListener('click', fitTo('all'))

// ---------------------------------------------------------------- the side panel
const tag = (name, cls, text) => {
  const node = document.createElement(name)
  node.className = cls
  node.textContent = text
  return node
}
const line = (cls, text) => tag('div', cls, text)

const bodyCard = body => {
  const card = document.createElement('div')
  card.className = `body${body.name === selected ? ' sel' : ''}`
  const head = line('', '')
  head.append(tag('span', 'name', body.name), ' ', tag('span', 'meta', `${body.state.hp}hp ${body.state.food}f`))
  card.append(head, line('meta', `${Math.round(body.state.pos.x)},${Math.round(body.state.pos.y)},${Math.round(body.state.pos.z)}`))
  if (body.state.doing) card.append(line('doing', `doing ${body.state.doing}`))
  card.addEventListener('click', () => select(body.name))
  return card
}

// a body that is down is the ordinary case (eleven folders, three bodies): one quiet line, with the reason on hover
const renderList = () => {
  const up = snap.bodies.filter(b => b.up)
  const off = snap.bodies.filter(b => !b.up)
  const list = el('list')
  list.textContent = ''
  up.forEach(b => list.append(bodyCard(b)))
  const down = el('down')
  down.textContent = off.length ? `down: ${off.map(b => b.name).join(', ')}` : ''
  down.title = off.map(b => `${b.name}: ${b.error}`).join('\n')
}

const renderPlaces = () => {
  el('places').textContent = snap.places.map(p => `${p.name} @${p.x},${p.y},${p.z}`).join('\n')
}

// ---------------------------------------------------------------- the plan popup
// Three views of one footprint: the plan (what should stand there), the world (what the nearest body sees standing
// there, two levels deep) and the diff (the plan, with every cell the world disagrees with marked). The world comes
// from /api/world, which one running body scans for us: the popup asks again every 5 s while it shows it.
const CELL_PX = 22
const VIEWS = ['plan', 'world', 'diff']
const WORLD_POLL_MS = 5000
const stored = (key, fallback) => {
  try { return localStorage.getItem(key) ?? fallback } catch { return fallback }
}
const store = (key, value) => {
  try { localStorage.setItem(key, value) } catch {}
}
let planView = VIEWS.includes(stored('dashboard.plan.view', 'plan')) ? stored('dashboard.plan.view', 'plan') : 'plan'
let planLevel = null
let planPlace = null      // the place the popup shows
let planWorld = null      // the last /api/world answer for it (or {error}), null while none has come
let planTimer = null

const hatch = (c, px, py, w, h, colour) => {
  c.save()
  c.beginPath(); c.rect(px, py, w, h); c.clip()
  c.strokeStyle = colour
  c.lineWidth = 1.5
  for (let d = -h; d < w; d += 5) { c.beginPath(); c.moveTo(px + d, py + h); c.lineTo(px + d + h, py); c.stroke() }
  c.restore()
}

// what the diff knows about every plan cell; without a world answer, every cell is unseen
const diffOf = parsed => layerDiff(planPlace, planWorld?.cells ?? [], planLevel)

const cellFill = (cell, view) => {
  if (view === 'world') return cell.seen ? worldColour(cellWorldBlock(cell)) : worldColour('unloaded')
  return cellColour(cell.ch, cell.spec)
}

const drawPlanGrid = (parsed, view) => {
  const dpr = window.devicePixelRatio || 1
  const w = parsed.width * CELL_PX
  const h = parsed.height * CELL_PX
  const pc = el('planCanvas')
  pc.style.width = `${w}px`
  pc.style.height = `${h}px`
  pc.width = Math.round(w * dpr)
  pc.height = Math.round(h * dpr)
  const c = pc.getContext('2d')
  c.setTransform(dpr, 0, 0, dpr, 0, 0)
  c.fillStyle = '#0e1015'
  c.fillRect(0, 0, w, h)
  const diff = diffOf(parsed)
  diff.cells.forEach(cell => {
    const px = cell.dx * CELL_PX
    const py = cell.dz * CELL_PX
    c.fillStyle = cellFill(cell, view)
    c.fillRect(px, py, CELL_PX - 1, CELL_PX - 1)
    if (view === 'plan') return
    if (!cell.seen) { hatch(c, px, py, CELL_PX - 1, CELL_PX - 1, 'rgba(139,149,165,0.55)'); return }
    if (view !== 'diff') return
    if (cell.ok === null) { hatch(c, px, py, CELL_PX - 1, CELL_PX - 1, 'rgba(224,160,48,0.8)'); return }
    if (cell.ok) return
    hatch(c, px, py, CELL_PX - 1, CELL_PX - 1, 'rgba(240,144,126,0.9)')
    c.strokeStyle = '#f0907e'
    c.lineWidth = 2
    c.strokeRect(px + 1, py + 1, CELL_PX - 3, CELL_PX - 3)
  })
}

const legendItem = (label, colour, cls = '') => {
  const item = tag('span', 'legendItem', '')
  const swatch = tag('span', `legendSwatch${cls ? ' ' + cls : ''}`, '')
  if (colour) swatch.style.background = colour
  item.append(swatch, ` ${label}`)
  return item
}

// the plan's legend lists one swatch per cell kind actually in this plan (in the order it is first met), not every
// kind the legend knows - a 7x7 carrot patch has no business listing bamboo. The world's lists the blocks seen.
const drawPlanLegend = (parsed, view) => {
  const legend = el('planLegend')
  legend.textContent = ''
  if (view === 'world') {
    const diff = diffOf(parsed)
    const seen = [...new Set(diff.cells.filter(c => c.seen).map(c => cellWorldBlock(c)))]
    seen.forEach(name => legend.append(legendItem(name.replaceAll('_', ' '), worldColour(name))))
    if (diff.unseen) legend.append(legendItem('not loaded', null, 'unseen'))
    return
  }
  const kinds = [...new Map(diffOf(parsed).cells.map(c => [c.ch, c])).values()]
  kinds.forEach(c => legend.append(legendItem(cellLabel(c.ch, c.spec), cellColour(c.ch, c.spec))))
  if (view !== 'diff') return
  legend.append(legendItem('differs', null, 'differ'), legendItem('unsure', null, 'unsure'), legendItem('not loaded', null, 'unseen'))
}

const ago = at => `${Math.max(0, Math.round((Date.now() - at) / 1000))}s ago`

const worldStatus = parsed => {
  if (planView === 'plan') return { text: '', error: false }
  if (!planWorld) return { text: 'asking the nearest body…', error: false }
  if (planWorld.error) return { text: planWorld.error, error: true }
  const diff = diffOf(parsed)
  const seenBy = `seen by ${planWorld.body}, ${planWorld.distance} blocks off, ${ago(planWorld.at)}`
  const counts = planView === 'diff' ? [`${diff.differ} of ${diff.total} cells differ`] : []
  if (diff.unseen) counts.push(`${diff.unseen} not loaded`)
  if (diff.unsure) counts.push(`${diff.unsure} unsure (world details unavailable)`)
  return { text: [seenBy, ...counts].join(' · '), error: false }
}

const renderPlanCard = () => {
  if (!planPlace) return
  const parsed = parsePlacePlan(planPlace)
  if (parsed.error) return
  VIEWS.forEach(v => el('planView').querySelector(`[data-view="${v}"]`).classList.toggle('on', v === planView))
  const status = worldStatus(parsed)
  el('planWorld').textContent = status.text
  el('planWorld').className = status.error ? 'err' : ''
  drawPlanLegend(parsed, planView)
  drawPlanGrid(parsed, planView)
}

const fetchWorld = () => {
  if (!planPlace || planView === 'plan') return
  const asked = planPlace.name
  fetch(`/api/world?place=${encodeURIComponent(asked)}`)
    .then(r => r.json())
    .then(w => { if (planPlace?.name === asked) { planWorld = w; renderPlanCard() } })
    .catch(e => { if (planPlace?.name === asked) { planWorld = { error: `no answer from the dashboard: ${e.message}` }; renderPlanCard() } })
}

const stopWorldPoll = () => { clearInterval(planTimer); planTimer = null }
const startWorldPoll = () => {
  stopWorldPoll()
  if (planView === 'plan') return
  fetchWorld()
  planTimer = setInterval(fetchWorld, WORLD_POLL_MS)
}

const setPlanView = view => {
  planView = view
  store('dashboard.plan.view', view)
  renderPlanCard()
  startWorldPoll()
}
el('planView').addEventListener('click', e => {
  const view = e.target.closest('button')?.dataset.view
  if (view) setPlanView(view)
})

// a place opens only if it has a plan that actually parses; a bare point (a hut, a marker) has nothing to show
const showPlan = (place, world = null) => {
  if (!place?.structure) return
  const parsed = parsePlacePlan(place)
  if (parsed.error) return
  planPlace = place
  const levels = planLevels(place)
  planLevel = null
  const birdsEye = document.createElement('option')
  birdsEye.value = 'birds-eye'
  birdsEye.textContent = 'Bird’s-eye view (all layers)'
  el('planLayer').replaceChildren(birdsEye, ...levels.map(y => { const option = document.createElement('option'); option.value = y; option.textContent = `Y = ${y} (layer ${y - place.y})`; return option }))
  el('planLayer').value = 'birds-eye'
  planWorld = world?.place === place.name || world?.error ? world : null
  el('planTitle').textContent = place.name
  el('planMeta').textContent = [
    `by ${place.by ?? 'unclaimed'}`,
    place.note || null,
    `${parsed.width}x${parsed.height} footprint, ${levels.length} block elevations. Bird’s-eye view shows the highest planned block in each column; select a layer to inspect it separately. Anchored at ${place.x},${place.y},${place.z} (north-west corner)`
  ].filter(Boolean).join('\n')
  el('planHover').textContent = ''
  renderPlanCard()
  el('planOverlay').hidden = false
  if (planWorld && !planWorld.error) { stopWorldPoll(); planTimer = setInterval(fetchWorld, WORLD_POLL_MS); return }
  startWorldPoll()
}

el('planLayer').addEventListener('change', e => { planLevel = e.target.value === 'birds-eye' ? null : Number(e.target.value); el('planHover').textContent = ''; renderPlanCard() })

const openPlan = name => showPlan(snap.places.find(p => p.name === name))

const closePlan = () => { el('planOverlay').hidden = true; stopWorldPoll(); planPlace = null; planWorld = null }

// hovering a cell says what the plan wants there, what stands there, and whether the two agree
const hoverText = cell => {
  const where = `${cell.ch} at ${cell.x},${cell.y},${cell.z}`
  const plan = `plan: ${cellLabel(cell.ch, cell.spec)} (${cell.expected})`
  if (planView === 'plan' || !planWorld?.cells) return [where, plan]
  const verdict = !cell.seen ? 'not loaded' : cell.ok === null ? 'unsure' : cell.ok ? 'matches' : 'differs'
  return [where, plan, `world: ${worldLabel(cell)}`, verdict]
}
el('planCanvas').addEventListener('mousemove', e => {
  if (!planPlace) return
  const r = el('planCanvas').getBoundingClientRect()
  const dx = Math.floor((e.clientX - r.left) / CELL_PX)
  const dz = Math.floor((e.clientY - r.top) / CELL_PX)
  const cell = diffOf(parsePlacePlan(planPlace)).cells.find(c => c.dx === dx && c.dz === dz)
  const hover = el('planHover')
  hover.textContent = ''
  if (!cell) return
  const parts = hoverText(cell)
  parts.forEach((part, i) => hover.append(i ? tag('span', 'muted', ' · ') : '', part))
})
el('planCanvas').addEventListener('mouseleave', () => { el('planHover').textContent = '' })

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el('planOverlay').hidden) closePlan() })
el('planOverlay').addEventListener('click', e => { if (e.target === el('planOverlay')) closePlan() })
el('planClose').addEventListener('click', closePlan)

const select = name => {
  selected = name
  // the previous body's picture would otherwise sit under this one's name until the first new frame arrives
  el('lookimg').src = ''
  el('lookimg').hidden = true
  el('lookBig').src = ''
  el('lookBig').hidden = true
  el('lookimgMarks').innerHTML = ''
  el('lookBigMarks').innerHTML = ''
  el('lookname').textContent = name
  // cleared and rendered before the fetch: the new body's log lands scrolled to the bottom instead of pinned
  // being measured against whatever the previous body's list was scrolled to
  actionsEntries = []
  renderActions()
  renderList()
  draw()
  setWatching(Boolean(name))
  refreshActions()
}

// ---------------------------------------------------------------- the action log
// Ages are relative (-12s), so every 2 s poll redraws the list even when the entries themselves have not changed.
const relAge = (now, iso) => {
  const s = Math.max(0, Math.round((now - Date.parse(iso)) / 1000))
  return s < 60 ? `-${s}s` : s < 3600 ? `-${Math.floor(s / 60)}m` : `-${Math.floor(s / 3600)}h`
}
let actionsEntries = []
const renderActions = () => {
  if (!selected) return
  const log = el('actionsLog')
  const pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 12
  const now = Date.now()
  log.textContent = ''
  actionsEntries.forEach(e => {
    const row = line(e.bad ? 'err' : '', `${relAge(now, e.t)} ${e.type} ${e.gist}`)
    row.title = e.gist
    log.append(row)
  })
  if (pinned) log.scrollTop = log.scrollHeight
}
// a poll superseded by a later one - a body switch, or two overlapping polls for the same body - must not
// overwrite what the latest request shows
let actionsRequest = 0
const refreshActions = () => {
  const id = ++actionsRequest
  if (!selected) { actionsEntries = []; return renderActions() }
  fetch(`/api/actions/${encodeURIComponent(selected)}`)
    .then(r => r.ok ? r.json() : { entries: [] })
    .then(a => { if (id === actionsRequest) { actionsEntries = a.entries ?? []; renderActions() } })
    .catch(() => {})
}

// each entity the picture shows, outlined where it is drawn and labelled with its distance, so nobody has to match
// the caption's pixel numbers by eye; boxes are fractions of the picture, so they follow it however it is scaled
// a player's name comes off the wire, and the marks are written as html
const escapeHtml = text => String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const marksHtml = marks => marks.map(({ name, kind, dist, box: [x1, y1, x2, y2] }) =>
  `<div class="mark ${escapeHtml(kind ?? '')}" style="left:${x1 * 100}%;top:${y1 * 100}%;width:${(x2 - x1) * 100}%;height:${(y2 - y1) * 100}%"><span>${escapeHtml(name)} ${Number(dist)}m</span></div>`).join('')

// a look's caption under its picture, or why there is no picture. Once a picture is up it stays up: an error
// later (a busy body) only changes the caption, so the card never loses and regains its 180px on a bad frame
const showLook = (img, meta, look) => {
  if (look.error) {
    if (img.src === '') img.hidden = true
    meta.className = 'err'
    meta.textContent = `${selected}: ${look.error}`
    return
  }
  img.hidden = false
  el(`${img.id}Marks`).innerHTML = marksHtml(look.marks ?? [])
  meta.className = ''
  const at = look.at ? `${look.at.x} ${look.at.y} ${look.at.z}` : null
  meta.textContent = [[`${selected} · ${look.view}`, at].filter(Boolean).join(' · '), look.blocked, look.seen.length ? `sees: ${look.seen.join(', ')}` : 'sees nothing alive'].filter(Boolean).join('\n')
}

// the inline card's own live stream, the same mechanism as the popup's (below): started by selecting a body,
// stopped by "pause" (or deselecting). Independent of the popup - both read the look cache in src/vision/eyes.mjs,
// so an identical unchanged scene is served from the last-frame cache and costs one render, not two, however many
// streams are open on a body.
let watching = false
let watchStream = null
const closeWatch = () => { watchStream?.close(); watchStream = null }
const startWatch = () => {
  if (!selected) return
  closeWatch()
  el('lookmeta').className = ''
  if (el('lookimg').hidden) el('lookmeta').textContent = 'rendering…'
  watchStream = new EventSource(`/api/look/${encodeURIComponent(selected)}/live`)
  watchStream.onmessage = e => {
    const look = JSON.parse(e.data)
    if (look.png) el('lookimg').src = `data:image/png;base64,${look.png}`
    showLook(el('lookimg'), el('lookmeta'), look)
  }
}
const setWatching = on => {
  watching = on
  el('relook').textContent = on ? 'pause' : 'watch'
  if (on) startWatch()
  else closeWatch()
}
el('relook').addEventListener('click', () => setWatching(!watching))

// where the game draws each of mineflayer's window slots, as [row, column] of #lookInventory's grid: 5-8 armour, 45 the
// offhand beside the boots, 9-35 the main grid, 36-44 the hotbar (rows 5 and 9 are the gaps)
const slotPlace = slot => slot <= 8 ? [slot - 4, 1] : slot === 45 ? [4, 5] : slot <= 35 ? [6 + Math.floor((slot - 9) / 9), 1 + (slot - 9) % 9] : [10, slot - 35]
const INVENTORY_SLOTS = [5, 6, 7, 8, 45, ...Array.from({ length: 36 }, (_, i) => i + 9)]
// an item textures/ has no picture for: its initials, remembered so later draws do not ask for it again
const noIcon = new Set()
const initials = name => `<span class="abbr">${name.split('_').map(w => w[0]).join('').slice(0, 3).toUpperCase()}</span>`
const iconHtml = name => noIcon.has(name) ? initials(name) : `<img src="/api/icon/${name}" data-item="${name}" alt="">`
const cellHtml = (slot, stack, selected, [row, column]) => {
  const inside = stack ? iconHtml(stack.name) + (stack.count > 1 ? `<span class="count">${stack.count}</span>` : '') : ''
  return `<div class="slot${selected ? ' selected' : ''}" data-slot="${slot}" style="grid-area:${row}/${column}"${stack ? ` title="${stack.name} ×${stack.count}"` : ''}>${inside}</div>`
}
const inventoryHtml = screen => {
  const bySlot = new Map(screen.slots.map(s => [s.slot, s]))
  return INVENTORY_SLOTS.map(slot => cellHtml(slot, bySlot.get(slot), slot === 36 + screen.selected, slotPlace(slot))).join('')
}
// where the game draws a container's slots: by window type, [row, column] of #lookWindow's grid and how many columns it has
const rows9 = s => [1 + Math.floor(s / 9), 1 + s % 9]
const windowLayout = type => /hopper$/.test(type) ? { columns: 5, place: s => [1, 1 + s] }
  : /furnace$|smoker$/.test(type) ? { columns: 5, place: s => [[1, 1], [3, 1], [2, 5]][s] }
  : /generic_3x3$/.test(type) ? { columns: 3, place: s => [1 + Math.floor(s / 3), 1 + s % 3] }
  : /crafting$/.test(type) ? { columns: 5, place: s => s === 0 ? [2, 5] : [1 + Math.floor((s - 1) / 3), 1 + (s - 1) % 3] }
  : { columns: 9, place: rows9 }
const windowHtml = w => {
  const { columns, place } = windowLayout(w.type)
  const bySlot = new Map(w.slots.map(s => [s.slot, s]))
  return { columns, html: Array.from({ length: w.size }, (_, slot) => cellHtml(slot, bySlot.get(slot), false, place(slot))).join('') }
}
const windowMeta = w => `${w.title} at ${w.at ? `${w.at.x},${w.at.y},${w.at.z}` : '?'}${w.open ? '' : ` · closed ${Math.round((Date.now() - w.closedAt) / 1000)} s ago`}`
// the HUD as the game draws it: ten icons a row, each full, half or empty
const hudRow = (kind, value) => Array.from({ length: 10 }, (_, i) => `<i class="${kind} ${value >= (i + 1) * 2 ? 'full' : value >= i * 2 + 1 ? 'half' : 'empty'}"></i>`).join('')
const hudHtml = s => [
  `<span>${s.armor > 0 ? hudRow('armor', s.armor) : ''}</span><span class="xp">${s.xp}</span><span>${s.oxygen < 20 ? hudRow('bubble', s.oxygen) : ''}</span>`,
  `<span>${hudRow('heart', s.hp)}</span><span></span><span>${hudRow('food', s.food)}</span>`
].join('')
// error does not bubble, so it is caught on its way down - on #lookCard, which covers both the inventory grid
// and a container's own grid
el('lookCard').addEventListener('error', e => {
  const name = e.target.dataset?.item
  if (!name) return
  noIcon.add(name)
  e.target.outerHTML = initials(name)
}, true)
// each part redrawn only when its own html changed, so unrelated parts (and the browser) never flicker
const shownHtml = {}
const show = (id, html) => {
  if (shownHtml[id] === html) return
  shownHtml[id] = html
  if (id === 'lookWindowMeta') el(id).textContent = html
  else el(id).innerHTML = html
}
const showScreen = screen => {
  show('lookHud', screen ? hudHtml(screen) : '')
  show('lookInventory', screen ? inventoryHtml(screen) : '')
  const w = screen?.window
  const drawn = w ? windowHtml(w) : { columns: 9, html: '' }
  el('lookWindow').style.setProperty('--columns', drawn.columns)
  show('lookWindow', drawn.html)
  show('lookWindowMeta', w ? windowMeta(w) : '')
}
const loadScreen = () => {
  if (!selected) return Promise.resolve()
  return fetch(`/api/screen/${encodeURIComponent(selected)}?t=${Date.now()}`).then(res => (res.ok ? res.json() : null)).then(showScreen).catch(() => showScreen(null))
}

// the popup: the same view big and live, each frame shown the moment the dashboard pushes it down one event stream.
// The screen under it is asked for a second after the last answer ARRIVED, so a slow body never queues asks up;
// lookRun tells a screen loop that was closed mid-ask (and maybe reopened) from the one that should carry on
const INVENTORY_MS = 1000
let lookStream = null
let inventoryTimer = null
let lookRun = 0
const liveScreen = run => loadScreen().then(() => {
  if (run === lookRun) inventoryTimer = setTimeout(() => liveScreen(run), INVENTORY_MS)
})
const openLook = () => {
  if (!selected) return
  el('lookOverlay').hidden = false
  if (el('lookBig').hidden) el('lookBigMeta').textContent = 'rendering…'
  lookStream = new EventSource(`/api/look/${encodeURIComponent(selected)}/live`)
  lookStream.onmessage = e => {
    const look = JSON.parse(e.data)
    if (look.png) el('lookBig').src = `data:image/png;base64,${look.png}`
    showLook(el('lookBig'), el('lookBigMeta'), look)
  }
  liveScreen(++lookRun)
}
const closeLook = () => {
  el('lookOverlay').hidden = true
  lookStream?.close()
  lookStream = null
  lookRun++
  clearTimeout(inventoryTimer)
}
el('lookimg').addEventListener('click', openLook)
el('lookClose').addEventListener('click', closeLook)
el('lookOverlay').addEventListener('click', e => { if (e.target === el('lookOverlay')) closeLook() })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el('lookOverlay').hidden) closeLook() })

// ---------------------------------------------------------------- the chat log
// One line per thing said, merged by the server from every body's event log. The page keeps the last answer and
// only rebuilds the list when the log or the filter changed, so the 2 s poll costs nothing while nobody talks.
const remembered = (key, fallback) => {
  try {
    const v = localStorage.getItem(key)
    return v === null ? fallback : v === '1'
  } catch {
    return fallback
  }
}
const remember = (key, on) => {
  try { localStorage.setItem(key, on ? '1' : '0') } catch {}
}

// a stable colour per speaker: a human is the pink the map marks them with, an agent picks from a palette by name
const SPEAKER_COLOURS = ['#6ee7a8', '#7fb8ff', '#f5c76a', '#c39bff', '#ff9f7a', '#5fd8d8', '#d9e36e', '#ff85a1', '#9fd3ff', '#b5e07a']
const hashName = name => [...name].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7)
const isHuman = name => !snap.agents.includes(name)
const speakerColour = name => isHuman(name) ? '#f08ad0' : SPEAKER_COLOURS[hashName(name) % SPEAKER_COLOURS.length]

const clock = t => t.slice(11, 19)

let chatLast = { messages: [] }
let chatShown = ''   // what the list currently holds, so a poll that changed nothing does not rebuild it

const msgRow = m => {
  const row = document.createElement('div')
  row.className = `msg ${m.kind}${isHuman(m.from) ? ' human' : ''}`
  row.title = `${m.t}${m.to ? ` · whispered to ${m.to}` : ''}`
  const who = tag('span', 'who', m.from)
  who.style.color = speakerColour(m.from)
  if (m.to) {
    const to = tag('span', 'who', m.to)
    to.style.color = speakerColour(m.to)
    const arrow = tag('span', 'muted', ' → ')
    who.append(arrow, to)
  }
  row.append(tag('span', 'when', clock(m.t)), who, tag('span', 'text', m.message))
  return row
}

const chatFilter = () => {
  const needle = el('chatfilter').value.trim().toLowerCase()
  const hideWhispers = el('chatwhispers').checked
  return m => {
    if (hideWhispers && m.kind === 'whisper') return false
    if (!needle) return true
    return m.from.toLowerCase().includes(needle) || (m.to ?? '').toLowerCase().includes(needle) || m.message.toLowerCase().includes(needle)
  }
}

const renderChat = () => {
  const log = el('chatlog')
  const shown = chatLast.messages.filter(chatFilter())
  const signature = `${el('chatfilter').value}|${el('chatwhispers').checked}|${shown.length}|${shown[shown.length - 1]?.t ?? ''}|${shown[shown.length - 1]?.message ?? ''}`
  if (signature === chatShown) return
  chatShown = signature
  // the reader who scrolled up to read something old keeps their place; everyone else follows the newest line
  const pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 12
  log.textContent = ''
  if (!shown.length) log.append(Object.assign(tag('div', '', chatLast.messages.length ? 'nothing matches' : 'nobody has said anything yet'), { id: 'chatempty' }))
  shown.forEach(m => log.append(msgRow(m)))
  const whispers = chatLast.messages.filter(m => m.kind === 'whisper').length
  el('chatcount').textContent = `${shown.length}${shown.length !== chatLast.messages.length ? ` of ${chatLast.messages.length}` : ''} lines · ${whispers} whispers`
  if (pinned) log.scrollTop = log.scrollHeight
}

const refreshChat = () => fetch('/api/chat?limit=300')   // the same 300 lines the server inlined on load
  .then(r => r.json())
  .then(c => { chatLast = c; renderChat() })
  .catch(() => {})

const setChatOpen = open => {
  el('chat').classList.toggle('closed', !open)
  el('chattoggle').textContent = open ? 'hide ▾' : 'show ▴'
  remember('dashboard.chat.open', open)
  resize()
  if (open) el('chatlog').scrollTop = el('chatlog').scrollHeight
}
el('chattoggle').addEventListener('click', () => setChatOpen(el('chat').classList.contains('closed')))
el('chatfilter').addEventListener('input', renderChat)
el('chatwhispers').addEventListener('change', () => { remember('dashboard.chat.hideWhispers', el('chatwhispers').checked); renderChat() })
el('chatwhispers').checked = remembered('dashboard.chat.hideWhispers', false)
el('chat').classList.toggle('closed', !remembered('dashboard.chat.open', true))
el('chattoggle').textContent = el('chat').classList.contains('closed') ? 'show ▴' : 'hide ▾'

// ---------------------------------------------------------------- polling
// ?farm=<name> opens that place's popup once, as soon as its plan is in hand - the hook a headless screenshot uses
let farmParam = new URLSearchParams(location.search).get('farm')

const applyState = s => {
  snap = s
  const up = s.bodies.filter(b => b.up)
  el('status').textContent = `updated ${new Date(s.at).toLocaleTimeString()}`
  el('counts').textContent = `${up.length}/${s.bodies.length} up · ${s.places.length} places · ${s.zones.length} zones · ${s.humans.length} ${s.humans.length === 1 ? 'human' : 'humans'} in sight${s.villageError ? ` · village data: ${s.villageError}` : ''}`
  el('clock').textContent = up[0]?.state?.time ?? 'no body online'
  renderList()
  renderPlaces()
  draw()
  if (farmParam && s.places.some(p => p.name === farmParam)) {
    openPlan(farmParam)
    farmParam = null
  }
}

const refresh = () => fetch('/api/state')
  .then(r => r.json())
  .then(applyState)
  .catch(e => { el('status').textContent = `no answer from the dashboard: ${e.message}` })

// the server inlines the requested ?farm=<name> place (if any) as JSON in <head>, so the popup opens on the
// very first paint instead of racing the /api/state fetch below - the property a headless screenshot needs
if (VIEWS.includes(window.__PRELOAD_VIEW__)) planView = window.__PRELOAD_VIEW__
if (window.__PRELOAD_PLACE__) showPlan(window.__PRELOAD_PLACE__, window.__PRELOAD_WORLD__)
if (window.__PRELOAD_CHAT__) { chatLast = window.__PRELOAD_CHAT__; snap = { ...snap, agents: chatLast.agents }; renderChat() }

resize()
if (window.__PRELOAD_STATE__) applyState(window.__PRELOAD_STATE__)
refresh()
refreshChat()
refreshActions()
setInterval(refresh, 2000)
setInterval(refreshChat, 2000)
setInterval(refreshActions, 2000)
</script>
</body>
</html>
